modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/hammerknife404/golemarmor/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="hammerknife404"
displayURL="https://github.com/hammerknife404/golemarmor"
# Server-only mod: clients without it can still join without a red X in the server list.
displayTest="IGNORE_SERVER_VERSION"
description='''
Gives vanilla Iron Golems configurable armor, armor toughness and bonus health,
plus adjustable fire resistance and immunities to poison, magma blocks, plants and freezing.
Existing golems are updated when their chunk loads.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
